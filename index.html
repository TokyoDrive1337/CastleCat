<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игра: Кликер "Тёмное Фэнтези"</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        
        <div id="main-menu">
            <h1>Выберите класс</h1>
            <p>Ваш выбор определит ваш стартовый бонус XP.</p>
            <div class="class-selection">
                <button class="class-btn" data-class="Warrior">Воин</button>
                <button class="class-btn" data-class="Mage">Маг</button>
                <button class="class-btn" data-class="Rogue">Разбойник</button>
            </div>
            <p id="class-bonus"></p>
        </div>

        <div id="game-screen" style="display: none;">
            
            <div id="xp-container">
                <div id="level-info">Уровень 1 (0%)</div>
                <div id="xp-bar-container">
                    <div id="xp-bar"></div>
                </div>
            </div>

            <div id="click-area">
                <img id="character-image" src="Images/Character_Warrior.png" alt="Персонаж" draggable="false">
            </div>

            <div id="shop">
                <button id="shop-btn-1" class="shop-item" data-item="healing-potion">
                    Зелье Лечения (0)
                    <br>Цена: 50
                </button>
                <button id="shop-btn-2" class="shop-item" data-item="magic-herb">
                    Волшебная Трава (0)
                    <br>Цена: 100
                </button>
                <button id="shop-btn-3" class="shop-item" data-item="heavy-armor">
                    Тяжелая Броня (0)
                    <br>Цена: 250
                </button>
            </div>

            <div id="money-container-bottom">
                <span id="money-display">0</span>
            </div>
            
            <div id="levelup-message" class="hidden">
                <p>Уровень повышен!</p>
                <p>+100 монет и +5% к XP!</p>
            </div>
        </div>

    </div>
    
    <script src="script.js"></script>
</body>
</html>
