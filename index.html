<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div id="start-overlay">
        <h1 data-lang="click_to_start">Click to Start</h1>
    </div>

    <audio id="bg-music" loop src="Music/Music Theme.mp3"></audio>

    <div id="game-container">

        <div id="music-controls">
            <button id="mute-btn" onclick="toggleMute()">
                <img id="speaker-icon" src="Images/icon_speaker_on.png" alt="Speaker">
            </button>
            <input type="range" id="volume-slider" min="0" max="100" value="30">
        </div>

        <div id="lang-switcher">
            <img src="Images/flag_en.png" alt="EN" onclick="changeLanguage('en')">
            <img src="Images/flag_lt.png" alt="LT" onclick="changeLanguage('lt')">
            <img src="Images/flag_ru.png" alt="RU" onclick="changeLanguage('ru')">
            <img src="Images/flag_ua.png" alt="UA" onclick="changeLanguage('ua')">
        </div>

        <div id="main-menu" class="hidden">
            <h2 data-lang="select_class">Select Your Class</h2>
            <div class="class-selection">
                <button class="class-btn" data-class="krest" onclick="selectClass('krest')">
                    <img src="Images/krest1.png" alt="Peasant">
                    <span data-lang="class_peasant">Peasant</span>
                </button>
                <button class="class-btn" data-class="BOW" onclick="selectClass('BOW')">
                    <img src="Images/BOW1.png" alt="Archer">
                    <span data-lang="class_archer">Archer</span>
                </button>
                <button class="class-btn" data-class="MAG" onclick="selectClass('MAG')">
                    <img src="Images/MAG1.png" alt="Mage">
                    <span data-lang="class_mage">Mage</span>
                </button>
                <button class="class-btn" data-class="krestos" onclick="selectClass('krestos')">
                    <img src="Images/krestos1.png" alt="Crusader">
                    <span data-lang="class_crusader">Crusader</span>
                </button>
            </div>
        </div>

        <div id="game-screen" class="hidden">
            
            <div id="xp-bar-container">
                <div id="xp-bar-fill"></div>
                <div id="xp-bar-sparkles"></div> 
                <span id="xp-text"></span> 
            </div>

            <div id="click-area">
                <img id="character-image" src="" alt="Character" onclick="handleClick()">
            </div>

            <div id="shop">
                <button class="shop-item" id="item-food" onclick="buyItem('food')">
                    <img src="Images/food.png" alt="Food">
                    <span data-lang="item_food_name">Food</span>
                    <span class="item-desc" data-lang="item_food_desc">Gives 5-10 XP</span>
                    <span class="item-cost" data-lang="cost">Cost</span>: 10
                </button>
                <button class="shop-item" id="item-water" onclick="buyItem('water')">
                    <img src="Images/water.png" alt="Water">
                    <span data-lang="item_water_name">Magic Water</span>
                    <span class="item-desc" data-lang="item_water_desc">Gives 10-16 XP</span>
                    <span class="item-cost" data-lang="cost">Cost</span>: 16
                </button>
                <button class="shop-item" id="item-herb" onclick="buyItem('herb')">
                    <img src="Images/herb.png" alt="Herb">
                    <span data-lang="item_herb_name">Magic Herb</span>
                    <span class="item-desc" data-lang="item_herb_desc">Gives 26-60 XP</span>
                    <span class="item-cost" data-lang="cost">Cost</span>: 160
                </button>
            </div>
        </div>

        <div id="money-container-bottom" class="hidden">
            <span id="money-count">0</span>
        </div>

        <div id="floating-text-container"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
